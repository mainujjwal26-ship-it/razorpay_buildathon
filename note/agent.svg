<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="625" viewBox="0 0 1360 625"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7A8699"/></marker></defs><rect width="1360" height="625" fill="#FFFFFF"/><text x="30" y="32" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#11243A" font-weight="bold">How the system works</text><text x="30" y="55" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">One bounced EMI: what calls what, and where each decision is actually made.</text><text x="30" y="92" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#1A4FD6" font-weight="bold" letter-spacing="1.4">LAYER 1 · THE CALLING BOT</text><text x="816" y="92" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#1A4FD6" font-weight="bold" letter-spacing="1.4">WHAT THE SERVER CALLS</text><rect x="30" y="104" width="182" height="128" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="121.0" y="157.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#11243A">Borrower&#x27;s phone</text><text x="121.0" y="183.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">Speaks Hindi,</text><text x="121.0" y="202.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">hears Meera</text><rect x="236" y="100" width="540" height="186" rx="9" fill="#EEF3FB" stroke="#A9C6F5" stroke-width="2"/><text x="506.0" y="129" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#11243A">Collections server  ·  Node, running on Replit</text><rect x="254" y="156" width="158" height="48" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="333.0" y="187.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#11243A">/call/transcribe</text><rect x="426" y="156" width="158" height="48" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="505.0" y="187.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#11243A">/call/turn</text><rect x="598" y="156" width="160" height="48" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="678.0" y="187.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#11243A">/call/speak</text><text x="506" y="232" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B85">Builds every prompt from the content files · enforces one payment link per call</text><text x="506" y="254" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B85">Writes every event to the database as it happens</text><line x1="218" y1="138" x2="232" y2="138" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><text x="225.0" y="130" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B85">audio in</text><line x1="232" y1="196" x2="218" y2="196" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><text x="225.0" y="214" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B85">audio out</text><rect x="816" y="104" width="212" height="72" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="922.0" y="130.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">Sarvam AI</text><text x="922.0" y="156.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">Speech to text,</text><text x="922.0" y="175.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">text to speech</text><rect x="816" y="192" width="212" height="86" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="922.0" y="225.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">Claude API</text><text x="922.0" y="251.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">Turn prompt → JSON:</text><text x="922.0" y="270.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">say · speak · action · end</text><line x1="782" y1="150" x2="810" y2="142" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><line x1="782" y1="196" x2="810" y2="220" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><rect x="1062" y="104" width="268" height="72" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="1196.0" y="130.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">Postgres</text><text x="1196.0" y="156.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">call_events: every event</text><text x="1196.0" y="175.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">of every call</text><rect x="1062" y="192" width="268" height="86" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="1196.0" y="225.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">GitHub  ·  call-logs branch</text><text x="1196.0" y="251.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">Transcript and events</text><text x="1196.0" y="270.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">pushed after each call</text><text x="1062" y="92" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#1A4FD6" font-weight="bold" letter-spacing="1.4">THE RECORD</text><text x="1330" y="296" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#1A4FD6">Read by Claude Code between calls — see the next diagram</text><text x="30" y="330" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#1A4FD6" font-weight="bold" letter-spacing="1.4">LAYER 2 · THE CALL REVIEW BOT</text><text x="734" y="330" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#1A4FD6" font-weight="bold" letter-spacing="1.4">LAYER 3 · THE ACTION-PLAN BOT</text><rect x="30" y="342" width="150" height="112" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="105.0" y="397.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">Call ends</text><text x="105.0" y="423.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">/call/finish</text><line x1="186" y1="372" x2="214" y2="372" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><line x1="186" y1="424" x2="214" y2="424" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><rect x="218" y="342" width="234" height="66" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="335.0" y="373.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#11243A">Claude API · review</text><text x="335.0" y="399.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">reason · promise · tone</text><rect x="218" y="418" width="234" height="66" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="335.0" y="449.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#11243A">Checks in code</text><text x="335.0" y="475.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">the same rules, exactly</text><line x1="458" y1="372" x2="486" y2="388" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><line x1="458" y1="450" x2="486" y2="420" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><rect x="490" y="352" width="206" height="112" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="593.0" y="398.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">Facts + verdicts</text><text x="593.0" y="424.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">A flag from either</text><text x="593.0" y="443.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">side counts as a breach</text><line x1="702" y1="408" x2="730" y2="408" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><rect x="734" y="352" width="250" height="112" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="859.0" y="388.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">Decision engine</text><text x="859.0" y="414.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">Borrower history + this call</text><text x="859.0" y="433.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">Two questions, rules only</text><text x="859.0" y="452.5" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">The model never routes</text><line x1="990" y1="388" x2="1018" y2="360" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><line x1="990" y1="408" x2="1018" y2="412" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><line x1="990" y1="428" x2="1018" y2="466" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><rect x="1022" y="336" width="234" height="46" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="1139.0" y="367.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#11243A">AI keeps dialling</text><rect x="1022" y="390" width="234" height="46" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="1139.0" y="421.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#11243A">A person calls</text><rect x="1022" y="444" width="234" height="46" rx="9" fill="#EEF3FB" stroke="#A9C6F5" stroke-width="2"/><text x="1139.0" y="475.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#11243A">Plan next cycle</text><text x="1139" y="506" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5B6B85">Calls, money, by when, gap to target</text><rect x="236" y="516" width="748" height="92" rx="9" fill="#FAFBFD" stroke="#C9D2E0" stroke-width="2" stroke-dasharray="7 5"/><text x="610.0" y="544" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#11243A">What the agent says and where the thresholds sit: the content files</text><text x="610" y="568" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B85">agent.md · script.md · policy.json · guardrails.json · review-checks.json · decision-rules.json</text><text x="610" y="590" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5B6B85">Read fresh on every call, so a change in tone or a threshold is a text edit, not a deploy.</text><line x1="471" y1="514" x2="471" y2="292" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)" stroke-dasharray="6 5"/><line x1="859" y1="514" x2="859" y2="470" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)" stroke-dasharray="6 5"/></svg>