<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="380" viewBox="0 0 1360 380"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7A8699"/></marker></defs><rect width="1360" height="380" fill="#FFFFFF"/><text x="30" y="32" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#11243A" font-weight="bold">How it was built</text><text x="30" y="55" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#5B6B85">A loop that closes in minutes, so a real call could change the agent the same evening.</text><rect x="30" y="86" width="232" height="92" rx="9" fill="#EEF3FB" stroke="#A9C6F5" stroke-width="2"/><text x="146.0" y="122.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">1  Interviews</text><text x="146.0" y="148.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">3 at a lender,</text><text x="146.0" y="167.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">transcribed by AI</text><line x1="268" y1="132" x2="292" y2="132" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><rect x="298" y="86" width="232" height="92" rx="9" fill="#EEF3FB" stroke="#A9C6F5" stroke-width="2"/><text x="414.0" y="122.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">2  Problem + rules</text><text x="414.0" y="148.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">Mine: process,</text><text x="414.0" y="167.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">script, guardrails</text><line x1="536" y1="132" x2="560" y2="132" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><rect x="566" y="86" width="232" height="92" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="682.0" y="122.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">3  Claude Code</text><text x="682.0" y="148.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">Writes the code,</text><text x="682.0" y="167.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">tests, sample data</text><line x1="804" y1="132" x2="828" y2="132" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><rect x="834" y="86" width="232" height="92" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="950.0" y="122.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">4  GitHub</text><text x="950.0" y="148.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">Every change</text><text x="950.0" y="167.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">committed</text><line x1="1072" y1="132" x2="1096" y2="132" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><rect x="1102" y="86" width="232" height="92" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="1218.0" y="122.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">5  Replit</text><text x="1218.0" y="148.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">Live app,</text><text x="1218.0" y="167.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">auto-deployed</text><line x1="1218" y1="184" x2="1218" y2="232" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><rect x="298" y="240" width="232" height="92" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="414.0" y="276.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">9  Edit content files</text><text x="414.0" y="302.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">A threshold or a line</text><text x="414.0" y="321.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">of script, not code</text><rect x="566" y="240" width="232" height="92" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="682.0" y="276.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">8  Claude reads them</text><text x="682.0" y="302.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">What worked, what</text><text x="682.0" y="321.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">broke a rule</text><rect x="834" y="240" width="232" height="92" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="950.0" y="276.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">7  Logs to GitHub</text><text x="950.0" y="302.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">Transcript and events</text><text x="950.0" y="321.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">pushed automatically</text><rect x="1102" y="240" width="232" height="92" rx="9" fill="#FFFFFF" stroke="#C9D2E0" stroke-width="2"/><text x="1218.0" y="276.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#11243A">6  A real call</text><text x="1218.0" y="302.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">Placed on a phone,</text><text x="1218.0" y="321.0" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#5B6B85">in Hindi</text><line x1="1096" y1="286" x2="1072" y2="286" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><line x1="828" y1="286" x2="804" y2="286" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><line x1="560" y1="286" x2="536" y2="286" stroke="#7A8699" stroke-width="2.2" marker-end="url(#a)"/><line x1="414" y1="238" x2="414" y2="186" stroke="#1A4FD6" stroke-width="2.2" marker-end="url(#a)"/><text x="30" y="362" text-anchor="start" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#1A4FD6">The loop closes here: what a live call revealed became a content edit, and the next call used it.</text></svg>